name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m mod_threat_lens scan examples/fixture-mod --format json --fail-on none
